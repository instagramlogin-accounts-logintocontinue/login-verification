<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a2535;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .top-bar {
      width: 100%;
      text-align: center;
      padding: 20px 16px 0;
      font-size: 15px;
      color: #c8d0db;
      font-weight: 400;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 0 24px;
      margin-top: 60px;
    }

    .ig-icon { margin-bottom: 48px; }

    .ig-icon img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: block;
    }

    .fields {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .field-wrap {
      position: relative;
      width: 100%;
      background: #243044;
      border: 1.5px solid #3a4a60;
      border-radius: 14px;
      padding: 0 18px;
      height: 52px;
      display: flex;
      align-items: center;
    }

    .field-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      padding-right: 44px;
      caret-color: #fff;
    }

    .field-wrap input::placeholder {
      color: #6b7a8f;
      font-size: 15px;
    }

    .eye-btn {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7a8f;
    }

    .eye-btn svg { width: 24px; height: 24px; }

    .btn-login {
      width: 100%;
      background: #1877f2;
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.15s;
      letter-spacing: 0.2px;
    }

    .btn-login:hover { background: #1565d8; }

    .forgot {
      font-size: 15px;
      color: #c8d0db;
      text-decoration: none;
      text-align: center;
      display: block;
      font-weight: 400;
      margin-bottom: 80px;
    }

    .forgot:hover { text-decoration: underline; }

    .btn-create {
      width: 100%;
      background: transparent;
      color: #4a9ff5;
      border: 1.5px solid #3a4a60;
      border-radius: 50px;
      padding: 14px;
      font-size: 16px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: border-color 0.15s;
      letter-spacing: 0.2px;
      margin-bottom: 44px;
    }

    .btn-create:hover { border-color: #4a9ff5; }
  </style>
</head>
